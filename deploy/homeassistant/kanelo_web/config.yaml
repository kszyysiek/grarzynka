name: KANELO Web
version: "1.2.0"
slug: kanelo_web
description: Serwuje stronę KANELO (eksport statyczny z /share/kanelo) przez nginx.
url: https://github.com/kszyysiek/grarzynka
arch:
  - aarch64
  - armv7
  - amd64
webui: http://[HOST]:[PORT:80]/
init: false
startup: application
boot: auto
map:
  - share:rw
ports:
  80/tcp: 8080
ports_description:
  80/tcp: Strona KANELO
options:
  public_link: true
  tunnel_token: ""
schema:
  public_link: bool
  tunnel_token: str?
