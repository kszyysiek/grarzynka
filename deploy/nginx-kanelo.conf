# nginx site for the static KANELO export (out/ copied to /var/www/kanelo).
# Installed by deploy/pi-setup.sh as /etc/nginx/sites-available/kanelo.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kanelo;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # hashed build assets never change
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # renders and the fly-through film; nginx serves byte ranges, so video seeking works
    location /renders/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
